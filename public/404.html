<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio Ruffini</title>
    <!--
      GitHub Pages has no real server-side routing: a direct hit or refresh on
      a client-side route (e.g. /projects/some-id) resolves to no actual file,
      so GitHub serves this 404 page instead. It re-encodes the intended path
      into a query string and bounces to the real index.html, which decodes it
      back (see the matching inline script there) before React Router ever
      reads the URL. Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1 // keeps '/gabrieleruffini_portfolio'
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
