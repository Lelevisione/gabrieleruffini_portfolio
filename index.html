<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Ruffini</title>
    <!-- Pixel-art zap icon from the same set used site-wide (public/assets/icons/pixelart). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Case-study pages borrow this display serif for hero titles, the actual
         typeface named in the Oracle project's own visual-language notes, plus
         a pixel display face for section headings and pull-quotes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <!-- Decodes the redirect from public/404.html back into a real path via
         history.replaceState, before React Router mounts and reads the URL.
         Counterpart of the script there; see that file for why this exists. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
